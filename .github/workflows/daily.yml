name: daily-pm-report

on:
  schedule:
    - cron: '0 1 * * *'        # 每日 UTC 01:00 = 北京 09:00
  workflow_dispatch:          # 支持手动触发

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史才能统计提交/指标

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run daily harness
        run: python daily_run.py --repo . --domain "${DOMAIN:-default}"
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          # 接入 PM / 文档数据源时，把凭证作为 Secrets 注入；
          # config/settings.json 里只用 *_env 引用变量名，不落盘明文。
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # reports/ 刻意写在 .gitignore 里：报告可能包含你的项目细节，
      # 默认不进版本库，改为以构建产物形式留存，避免误提交到公开仓库。
      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pm-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90
